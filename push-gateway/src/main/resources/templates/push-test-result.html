<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEPL Push 결과</title><link rel="stylesheet" th:href="@{/push-test.css}"><meta th:if="${event != null and event.status != 'SENT' and event.status != 'DEAD'}" http-equiv="refresh" content="3"></head>
<body><main class="shell"><section class="panel"><header class="head"><div class="brand"><div class="mark"><i class="dot red"></i><i class="dot blue1"></i><i class="dot blue2"></i></div><div><strong>DEPL</strong><span>Push Gateway</span></div></div><nav class="nav"><a th:href="@{/internal/push-test/enrollment}">QR 등록</a><a class="active" th:href="@{/internal/push-test/messages}">메시지 테스트</a></nav></header>
<div class="content"><h1 class="title">Push 요청 결과</h1><p class="error" th:if="${event == null}">요청을 찾을 수 없습니다.</p><p class="notice" th:if="${event != null and event.status != 'SENT' and event.status != 'DEAD'}">Queue 처리 대기 중입니다. 이 화면은 3초마다 자동 갱신됩니다.</p>
<dl th:if="${event != null}"><dt>이벤트 ID</dt><dd th:text="${event.eventId}"></dd><dt>대상</dt><dd th:text="|${event.targetType} / ${event.targetId}|"></dd><dt>알림 종류</dt><dd th:text="${event.notificationType.displayName()}"></dd><dt>Queue 상태</dt><dd th:text="${event.status}"></dd><dt>시도 횟수</dt><dd th:text="${event.attemptCount}"></dd><dt>마지막 오류</dt><dd th:text="${event.lastErrorCode ?: '-'}"></dd><dt>FCM 접수</dt><dd th:text="${event.resultCode == 'FCM_ACCEPTED' ? '접수됨' : '미접수'}"></dd><dt>요청 시각</dt><dd th:text="${event.requestedAt}"></dd><dt>처리 시각</dt><dd th:text="${event.processedAt ?: '-'}"></dd></dl><div class="actions"><a class="button secondary" th:href="@{/internal/push-test/enrollment}">QR 등록</a><a class="button" th:href="@{/internal/push-test/messages}">다른 메시지 보내기</a></div></div>
</section></main></body></html>
