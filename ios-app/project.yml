name: PushReceiver
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.18.0
targets:
  PushReceiver:
    type: application
    platform: iOS
    sources: [PushReceiver]
    resources:
      - path: Design/E9pay-Dots-Extracted.png
      - path: PushReceiver/GoogleService-Info.plist
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.sangwoo.push
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: PushReceiver/PushReceiver.entitlements
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
  PushReceiverTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PushReceiverTests]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.sangwoo.push.tests
    dependencies:
      - target: PushReceiver
